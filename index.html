<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramdan Kareem 🌙</title>
    
</head>
<body>
    <img src="https://decosnap-dz.com/wp-content/uploads/2025/02/%D8%AF%D9%8A%D9%83%D9%88%D8%B1-%D8%B1%D9%85%D8%B6%D8%A7%D9%86-2025.webp" style="width: 200px; height: 200px; border-radius: 50%;" >
    <br>
    <br>
    <br>
    <br>
    <br>
       <br>
    <br>
    <br>
    <br>
    <br>
    <div class="input">
        <input type="text" placeholder="✍️ دخل اسمك" id="i1">
     <br>
    <br>
    <br>
    <br>
    <input type="text" placeholder="✦ نفسك تطلع إيه ✦ 🌙" id="i2">

    <br>
    <br>
    <br>
    <button onclick="re()">انقر #  </button>
    </div>
    <p id="result"></p>
</body>
<style>
    body{
        background-color: rgb(0, 0, 0);
        text-align: center;
    }
    .input{
        background-color:rgb(223, 189, 0);
        margin-left: 400px;
        margin-right: 400px;
        padding-top: 45px;
        padding-bottom: 45px;
        border-radius: 15px;
        text-shadow: 0 0 10px rgba(212,175,55,0.6);
    
    }
    input{
        padding-top: 15px;
        padding-bottom: 15px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 25px;
    }
button{
    padding-left: 10px;
    padding-right: 10px;
    border-radius: 20px;
    background-color: aqua;
    cursor: pointer;
    transition: .5s;
}
button:hover{
    background-color: rgb(221, 255, 244);
}
p{
    color: aliceblue;
    font-size: 40px;
}
@media (max-width: 768px) {
    .input {
        padding: 20px 15px;
        gap: 15px;
    }
    input, button {
        font-size: 14px;
    }
    #result {
        font-size: 18px;
    }
}

@media (max-width: 480px) {
    img {
        width: 150px;
        height: 150px;
    }
    .input {
        padding: 15px 10px;
        gap: 10px;
    }
    input, button {
        font-size: 13px;
    }
    #result {
        font-size: 16px;
    }
}
</style>

<script>
function re() {
    var i1 = document.getElementById("i1").value.trim();
    var i2 = document.getElementById("i2").value.trim();

    if (i1 === "") {
        window.alert("معلش، دخل اسمك!");
    } else if (i2 === "") {
        window.alert("معلش، نفسك تطلع إيه؟");
    } else {
        document.getElementById("result").innerText = 
            `كل سنة وانت طيب يا ${i1} وعقبال ما نشوفك أكبر ${i2} في الدنيا 🌙`;
    }
}
</script>


</html>
