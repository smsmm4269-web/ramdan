<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Kareem 🌙</title>
<style>
body {
    margin: 0;
    background-color: rgb(0, 0, 0);
    text-align: center;
    font-family: 'El Messiri', sans-serif;
    color: #fff;
}

/* الصورة */
img {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    margin-top: 30px;
}

/* الصندوق responsive */
.input {
    background-color: rgb(223, 189, 0);
    max-width: 600px;
    width: 90%;
    margin: 30px auto;
    padding: 30px 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(212,175,55,0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* الإدخالات */
input {
    padding: 15px;
    border-radius: 25px;
    border: none;
    font-size: 16px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
}

/* الزرار */
button {
    padding: 12px;
    border-radius: 20px;
    background-color: aqua;
    cursor: pointer;
    transition: .3s;
    font-size: 16px;
    border: none;
}
button:hover {
    background-color: rgb(221, 255, 244);
}

/* النتيجة */
#result {
    margin-top: 20px;
    font-size: 24px;
    color: rgb(212,175,55);
    text-shadow: 0 0 10px rgba(212,175,55,0.7);
}

/* Responsive */
@media (max-width: 768px) {
    img {
        width: 150px;
        height: 150px;
    }
    .input {
        padding: 20px 15px;
        gap: 15px;
    }
    input, button {
        font-size: 14px;
    }
    #result {
        font-size: 20px;
    }
}

@media (max-width: 480px) {
    img {
        width: 120px;
        height: 120px;
    }
    .input {
        padding: 15px 10px;
        gap: 10px;
    }
    input, button {
        font-size: 13px;
    }
    #result {
        font-size: 16px;
    }
}
</style>
</head>
<body>

<img src="https://decosnap-dz.com/wp-content/uploads/2025/02/%D8%AF%D9%8A%D9%83%D9%88%D8%B1-%D8%B1%D9%85%D8%B6%D8%A7%D9%86-2025.webp">

<div class="input">
    <input type="text" placeholder="✍️ دخل اسمك" id="i1">
    <input type="text" placeholder="✦ نفسك تطلع إيه ✦ 🌙" id="i2">
    <button onclick="re()">انقر #</button>
</div>

<p id="result"></p>

<script>
function re() {
    var i1 = document.getElementById("i1").value.trim();
    var i2 = document.getElementById("i2").value.trim();

    if (i1 === "") {
        alert("معلش، دخل اسمك!");
    } else if (i2 === "") {
        alert("معلش، نفسك تطلع إيه؟");
    } else {
        document.getElementById("result").innerText = 
            `كل سنة وانت طيب يا ${i1} وعقبال ما نشوفك أكبر ${i2} في الدنيا 🌙`;
    }
}
</script>

</body>
</html>
